name: Update recipes

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:

  update-recipes:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: v0.24.2
        cache: true

    - name: Update release channel recipe
      run: pixi run update-recipe-release

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: Update julia recipe to latest juliaup release version
        title: '[AUTO] Update julia recipe'
        body: >-
          juliaup's release channel has moved forward; this PR regenerates
          julia/recipe.yaml with the new version, download URL, and sha256
          hashes.
          Please note: CI will not automatically run on this PR.
          To trigger CI, please close and re-open this PR.
        branch: update-recipes
        labels: no changelog
